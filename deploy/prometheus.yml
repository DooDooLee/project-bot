# 지표 수집 대상. app-server 는 docker-compose.yml 의 APP_SERVER_IP 로 연결된다.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["app-server:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["app-server:9101"]
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-server:8080"]
        labels: { service: backend }
  - job_name: ai-chat
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-server:8081"]
        labels: { service: ai-chat }
